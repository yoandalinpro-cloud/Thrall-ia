name: iPhone (.ipa)

# Construit l'appli iPhone sur un Mac de GitHub (pas besoin de Mac chez toi).
# Résultat : Thrall.ipa non signé, à installer avec Sideloadly (identifiant Apple gratuit).

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      - name: Compiler (sans signature)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            MARKETING_VERSION=$(node -p "require('./package.json').version") \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} build
      - name: Emballer en .ipa
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry Thrall.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Thrall-iPhone
          path: Thrall.ipa
      - name: Joindre à la release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Thrall.ipa
